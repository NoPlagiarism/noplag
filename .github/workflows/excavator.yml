on:
  workflow_dispatch:
  schedule:
    # run every 4 hours
    - cron: '20 */4 * * *'
name: Excavator

env:
  PYTHON_VER: "3.12.10"
  POETRY_VER: "2.3.2"

jobs:
  excavate:
    name: Excavate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@main
      - name: Excavate
        uses: ScoopInstaller/GithubActions@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_UPDATED: 1
  excavate-add:
    name: Excavate additional
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        working-directory: scripts
        with:
          enable-cache: true
      - name: uv sync
        shell: bash
        working-directory: scripts
        run: uv sync
      - name: "Excavate"
        shell: bash
        working-directory: scripts
        run: uv run python ./main.py main
      - name: Push changes
        uses: ad-m/github-push-action@master
